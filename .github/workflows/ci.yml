name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:wasm
      - name: Export contract schemas
        run: pnpm json-schema
      - name: Verify committed contract schemas
        run: |
          git diff --exit-code -- packages/schema/json
          test -z "$(git ls-files --others --exclude-standard packages/schema/json)"
      - name: Verify database migration metadata and schema drift
        run: |
          pnpm --filter @bgp/server exec drizzle-kit check
          pnpm db:generate
          git diff --exit-code -- apps/server/drizzle
          test -z "$(git ls-files --others --exclude-standard apps/server/drizzle)"
      - name: Start integration services
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml up -d --wait
          pnpm db:migrate
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      # Visual baselines use Windows fonts/GPU rasterization; the dedicated job compares them.
      - run: pnpm test:e2e --project=chromium --ignore-snapshots
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    env:
      CI: "true"
      BGP_PROPERTY_RUNS: "1000"
      BGP_PRNG_DRAWS: "100000"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify database migration metadata and schema drift
        run: |
          pnpm --filter @bgp/server exec drizzle-kit check
          pnpm db:generate
          git diff --exit-code -- apps/server/drizzle
          test -z "$(git ls-files --others --exclude-standard apps/server/drizzle)"
      - name: Start integration services
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml up -d --wait
          pnpm db:migrate
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e --ignore-snapshots
      - name: Performance suite (from T20)
        if: hashFiles('scripts/perf/*.ts') != ''
        run: pnpm perf

  table-visuals:
    runs-on: windows-latest
    env:
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium firefox webkit
      - run: pnpm test:e2e e2e/table-2d.spec.ts --workers=1
      - name: Upload visual diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: table-visual-diagnostics
          path: test-results/
          if-no-files-found: ignore
